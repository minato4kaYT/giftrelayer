<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать в NFT Marketplace</title>

    <!-- Подключение шрифтов и иконок -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: all 0.3s ease;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 8px 12px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 100%;
            transition: all 0.5s ease;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
            color: #fff;
            animation: fadeIn 1s ease-out;
        }

        .intro-text {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ddd;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.5s forwards;
        }

        .telegram-button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
            animation: fadeIn 1s ease-out 1s forwards;
        }

        .telegram-button:hover {
            background-color: #0077b3;
        }

        .telegram-button:active {
            background-color: #006099;
        }

        .footer {
            font-size: 14px;
            color: #ddd;
            margin-top: 30px;
            animation: fadeIn 1s ease-out 1.5s forwards;
        }

        .footer a {
            color: #3498db;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Анимация для плавного появления элементов */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Плавный переход для фона и других элементов */
        body, .container {
            transition: all 0.5s ease;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Добро пожаловать в NFT Marketplace</h1>
        <p class="intro-text">Будущее цифрового искусства уже здесь. Откройте удивительные NFT, получайте звезды и создавайте свою коллекцию на нашей уникальной платформе.</p>

        <!-- Кнопка авторизации через Telegram -->
        <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="qqgram_robot" data-size="large" data-onauth="onTelegramAuth(user)" data-request-access="write"></script>

        <div class="footer">
            <p>&copy; 2026 NFT Marketplace. Все права защищены.</p>
            <p><a href="#">Политика конфиденциальности</a> | <a href="#">Условия использования</a></p>
        </div>
    </div>

    <script type="text/javascript">
        function onTelegramAuth(user) {
            // Выводим информацию о пользователе
            alert('Вошли как ' + user.first_name + ' ' + user.last_name + ' (' + user.id + (user.username ? ', @' + user.username : '') + ')');

            // Отправляем данные на сервер для авторизации
            fetch('/telegram-auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_info: JSON.stringify(user) })
            })
            .then(response => response.json())
            .then(data => {
                // Перенаправляем на страницу после успешной авторизации
                window.location.href = '/dashboard';
            })
            .catch((error) => {
                console.error('Ошибка при отправке данных:', error);
            });
        }
    </script>
</body>

</html>
